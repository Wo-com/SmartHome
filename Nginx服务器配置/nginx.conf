user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	

	##
	# Gzip Settings
	##

	gzip on;
	gzip_disable "msie6";

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;

	
	server {
		listen 443;
		server_name www.cnetopro.com;  # localhost修改为您证书绑定的域名。
		ssl on;   #设置为on启用SSL功能。
		root html;
		index index.html index.htm;
		ssl_certificate cert/2690205_www.cnetopro.com.pem;   #将domain name.pem替换成您证书的文件名。
		ssl_certificate_key cert/2690205_www.cnetopro.com.key;   #将domain name.key替换成您证书的密钥文件名。
		ssl_session_timeout 5m;
		ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;  #使用此加密套件。
		ssl_protocols TLSv1 TLSv1.1 TLSv1.2;   #使用该协议进行配置。
		ssl_prefer_server_ciphers on;   

    	
		
		location /{
        	#root html;         #站点目录。
        	#index index.html index.htm;   
			root   /usr/local/NginxDoc/web/me;
            index  index.html;
    	}
		
		
			#个人简历
		location  =/me { 
			root   /usr/local/NginxDoc/web/me;
            index  index.html;
		}
			
		
		location  =/mqtt {  
			# 8083就是我们的emq的websocket的端口号
			proxy_pass http://www.cnetopro.com:8083;
			proxy_redirect off;
			proxy_set_header Host www.cnetopro.com:8083;
			proxy_set_header Sec-WebSocket-Protocol mqtt;

		# 这个是与你的 js客户端的库有关系，本博文的不需要，为了兼顾以后小伙伴，我这里注释了下！ 
			#more_clear_headers Sec-WebSocket-Protocol;
        
			# 这些都是 websocket必须要配置的
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
    	}
		location  =/test { 
			#测试接口
			proxy_pass http://localhost:8848/test;
		
		}
		location  =/login { 
			#登录接口
			proxy_pass http://localhost:8848/login;
		
		}
		location  =/active { 
			#激活设备接口
			proxy_pass http://localhost:8848/active;
		
		}
		location  =/device { 
			#设备接口
			proxy_pass http://localhost:8848/device;
		
		}
		location  =/changeDevice { 
			#切换设备接口
			proxy_pass http://localhost:8848/changeDevice;
		
		}
		location  =/power { 
			#设置权限接口
			proxy_pass http://localhost:8848/power;
		
		}
		location  =/setPower { 
			#设备接口
			proxy_pass http://localhost:8848/setPower;
		
		}
		location  =/saveName { 
			#更换名字接口
			proxy_pass http://localhost:8848/saveName;
		}
		
		location  =/saveState { 
			#保存任务接口
			proxy_pass http://localhost:8848/saveState;
		}
		
		location  =/saveTask { 
			#保存任务接口
			proxy_pass http://localhost:8848/saveTask;
		}
	
		location  =/getTask { 
			#获取任务接口
			proxy_pass http://localhost:8848/getTask;
		}
	
		location  =/delTask { 
			#删除任务接口
			proxy_pass http://localhost:8848/delTask;
		}
	
		
	
	
	
		
	}
	
	
	
}


